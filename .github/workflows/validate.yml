name: validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # Monday, to catch links that died since the last push

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Structural checks
        run: python3 scripts/validate.py

  links:
    # External links need the network and can flake, so they run separately and
    # never block a merge on someone else's outage.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Link check
        run: python3 scripts/validate.py --links
